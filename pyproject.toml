[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sagekit"
version = "0.1.0"
description = "Versioned engineering knowledge and contextual decisions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
faiss = ["faiss-cpu==1.13.2"]
mcp = ["mcp==1.30.0"]
postgres = ["psycopg[binary]==3.2.13"]
qdrant = ["qdrant-client==1.17.1"]
semantic = ["sentence-transformers>=5,<7"]

[project.scripts]
sagekit = "sagekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
