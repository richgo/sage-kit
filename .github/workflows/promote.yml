name: Promote independently verified knowledge
on:
  workflow_call:

permissions: {}
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      attestations: read
      contents: read
    environment: sagekit-promotion
    steps:
      - name: Validate protected publisher configuration
        env:
          SAGEKIT_REVISION: ${{ vars.SAGEKIT_REVISION }}
          VERIFIER_WORKFLOW: ${{ vars.SAGEKIT_VERIFIER_WORKFLOW }}
          VERIFIER_DIGEST: ${{ vars.SAGEKIT_VERIFIER_DIGEST }}
          SAGEKIT_REMOTE_URL: ${{ vars.SAGEKIT_REMOTE_URL }}
        run: |
          set -euo pipefail
          [[ "$SAGEKIT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIER_DIGEST" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIER_WORKFLOW" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+/\.github/workflows/[a-zA-Z0-9_.-]+\.ya?ml$ ]]
          [[ "$SAGEKIT_REMOTE_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: richgo/sage-kit
          ref: ${{ vars.SAGEKIT_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sagekit-verified-promotion
          path: verification
      - name: Authenticate approved request
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_WORKFLOW: ${{ vars.SAGEKIT_VERIFIER_WORKFLOW }}
          VERIFIER_DIGEST: ${{ vars.SAGEKIT_VERIFIER_DIGEST }}
        run: |
          set -euo pipefail
          gh attestation verify verification/promotion.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$VERIFIER_WORKFLOW" --signer-digest "$VERIFIER_DIGEST" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          python -c 'import json,os; data=json.load(open("verification/promotion.json")); assert data["pipeline"] == os.environ["GITHUB_REPOSITORY"] and data["run"] == os.environ["GITHUB_RUN_ID"]'
      - name: Promote verified knowledge
        env:
          SAGEKIT_RECEIPT_KEY: ${{ secrets.SAGEKIT_RECEIPT_KEY }}
          SAGEKIT_TOKEN: ${{ secrets.SAGEKIT_PROMOTION_TOKEN }}
          SAGEKIT_REMOTE_URL: ${{ vars.SAGEKIT_REMOTE_URL }}
        run: |
          set -euo pipefail
          sagekit sign-receipt verification/promotion.json > "$RUNNER_TEMP/sagekit-receipt.json"
          sagekit promote "$RUNNER_TEMP/sagekit-receipt.json"
